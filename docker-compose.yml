# Development PostgreSQL only. Native (non-Docker) setup is in docs/operations.md.
# Bound to localhost on purpose: never expose the database port publicly.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
